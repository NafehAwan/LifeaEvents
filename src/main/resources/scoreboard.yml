    lines: ["", "<white>Phase: <color:#FF1A1A>%phase%</color></white>", "<white>Hiders Left: <color:#FF1A1A>%hiders%</color></white>", "<white>Seekers: <color:#FF1A1A>%seekers%</color></white>", "", "<gray>%server%</gray>"]
  # %phase% %hiders% %seekers%
