# LifeaEvents scoreboard.yml
#
# Every minigame gets its OWN sidebar scoreboard for each of its 3 phases:
#   pre_lobby - shown while queued up waiting for the event to start
#   active    - shown to players still alive/playing once the match begins
#   spectate  - shown to eliminated players while they spectate the match
#
# Placeholders available everywhere: %event% %host% %server%
# pre_lobby additionally has: %time% (countdown remaining)
# active/spectate additionally have: %alive% %total% plus whatever that mode
# lists below it (round counters, scores, phase names, etc - see comments).
#
# MiniMessage color tags are supported. Keep lines short - client width varies.

server: "play.lifeamc.fun"

MACE_ROULETTE:
  pre_lobby:
    title: "<color:#FF1A1A><b>Mace Roulette</b></color>"
    lines: ["", "<white>Event: <color:#FF1A1A>%event%</color></white>", "<white>Starting in: <color:#FF1A1A>%time%</color></white>", "<white>Hosted By: <color:#FF1A1A>%host%</color></white>", "", "<gray>%server%</gray>"]
  # %round%
  active:
    title: "<color:#FF1A1A><b>Mace Roulette</b></color>"
    lines: ["", "<white>Round: <color:#FF1A1A>%round%</color></white>", "<white>Players Left: <color:#FF1A1A>%alive%</color>/%total%</white>", "", "<gray>%server%</gray>"]
  # %round%
  spectate:
    title: "<color:#FF1A1A><b>Spectating</b></color>"
    lines: ["", "<white>Mace Roulette</white>", "<white>Round: <color:#FF1A1A>%round%</color></white>", "<white>Players Left: <color:#FF1A1A>%alive%</color>/%total%</white>", "", "<gray>Shift x2 to switch player</gray>", "<gray>%server%</gray>"]

